name: Refresh data

# Fetches new NOAA-21 VIIRS detections into the hosted database, updates
# history and sites, and publishes the events the API serves.
on:
  schedule:
    # Every 6 hours; NRT data for India's day and night passes arrives
    # roughly 3 hours after each overpass.
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python refresh_data.py --days 3 --keep-days 60
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
